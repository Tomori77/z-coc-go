<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#02050d">
    <title>档案失落 · Zarkto's Table</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; --gold:#c8aa62; --teal:#4bb9a8; --rust:#9d5b45; --line:rgba(174,163,142,.15); --z-ui-gothic:'Grenze Gotisch','Noto Serif SC','Songti SC',serif; --z-ui-reading:'Noto Serif SC','Songti SC',serif; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            overflow: hidden;
            color: #dbe4f0;
            font-family:var(--z-ui-reading);
            background:
                linear-gradient(90deg, rgba(2,5,13,.9), rgba(2,5,13,.47) 54%, rgba(2,5,13,.72)),
                linear-gradient(0deg, #02050d 0%, transparent 68%),
                radial-gradient(700px 500px at 76% -8%, rgba(24,111,105,.18), transparent 65%),
                radial-gradient(620px 500px at 8% 108%, rgba(128,63,45,.14), transparent 68%),
                url("./assets/art/generated/scene-new-england-street-1926.webp") center 58% / cover no-repeat,
                #02050d;
        }
        body::before {
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            opacity:.17;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
        }
        body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.045; background:url("./assets/art/generated/dark-archive-cloth-texture.webp") center/560px 560px repeat; mix-blend-mode:soft-light; }
        .panel {
            position:relative;
            width:min(620px,100%);
            min-height:390px;
            padding:46px;
            overflow:hidden;
            border:1px solid var(--line);
            border-radius:16px;
            background:
                linear-gradient(145deg,rgba(16,25,32,.94),rgba(4,10,14,.95)),
                url("./assets/art/generated/dark-archive-cloth-texture.webp") center/470px 470px repeat;
            background-blend-mode:normal,soft-light;
            box-shadow:0 34px 100px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.045),inset 0 0 0 1px rgba(3,8,12,.5);
            backdrop-filter:blur(26px) saturate(125%);
            animation:archiveReveal .7s cubic-bezier(.16,1,.3,1) both;
        }
        .panel::before { content:""; position:absolute; width:300px; height:450px; right:-94px; bottom:-158px; pointer-events:none; opacity:.105; background:url("./assets/art/generated/cephalopod-archive-plate.webp") center/contain no-repeat; filter:grayscale(.65) sepia(.15) saturate(.65) contrast(1.18); transform:rotate(-6deg); -webkit-mask-image:linear-gradient(130deg,transparent 2%,#000 46%,#000); mask-image:linear-gradient(130deg,transparent 2%,#000 46%,#000); }
        .panel::after { content:""; position:absolute; left:0; top:0; width:72px; height:72px; pointer-events:none; opacity:.2; background:url("./assets/art/generated/archive-corner-brass.webp") left top/86px 86px no-repeat; filter:grayscale(.1) sepia(.12) saturate(.62) brightness(.75); }
        .panel-edge { position:absolute; inset:12px; pointer-events:none; border:1px solid rgba(195,161,90,.07); border-radius:10px; }
        .panel-edge::before { content:"FILE 404 / ARCHIVE WITHHELD"; position:absolute; right:16px; bottom:13px; color:rgba(195,161,90,.3); font:600 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.18em; }
        .panel .sigil { background-image:url("./assets/art/generated/instrument-status-medallion.webp"); background-position:center; background-size:138% 138%; background-repeat:no-repeat; border-color:transparent; }
        .panel .desc { position:relative; width:min(100%,430px); padding-left:14px; border-left:1px solid rgba(69,216,194,.22); }
        .sigil { position:relative; width:60px; height:60px; display:grid; place-items:center; border:1px solid rgba(216,184,78,.28); border-radius:12px; color:var(--gold); background:rgba(216,184,78,.07); box-shadow:0 12px 34px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05); }
        .sigil svg { width:31px; height:31px; }
        .eyebrow { margin:28px 0 10px; color:var(--teal); font:600 12px/1.2 var(--z-ui-gothic); letter-spacing:.16em; text-transform:uppercase; }
        .eyebrow::after { content:""; display:inline-block; width:58px; height:1px; margin:0 0 3px 12px; background:linear-gradient(90deg,var(--teal),transparent); opacity:.55; }
        h1 { margin:0; color:#f5edd2; font-family:var(--z-ui-gothic); font-size:clamp(36px,8vw,58px); line-height:1.08; letter-spacing:.035em; text-shadow:0 3px 22px rgba(0,0,0,.65); }
        p { margin:18px 0 0; max-width:42ch; color:#9aa7aa; font-size:15px; line-height:1.9; }
        .actions { display:flex; gap:10px; margin-top:30px; }
        a { min-height:46px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 20px; border-radius:8px; border:1px solid rgba(216,184,78,.4); color:#11130f; background:linear-gradient(135deg,#d9bd6d,#ad8945); box-shadow:0 12px 30px rgba(112,85,16,.23),inset 0 1px 0 rgba(255,255,255,.25); font:700 16px/1 var(--z-ui-gothic); letter-spacing:.06em; text-decoration:none; transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .22s ease,box-shadow .22s ease; }
        a:hover { filter:brightness(1.06); transform:translateY(-2px); }
        a:active { transform:scale(.97); }
        a:focus-visible { outline:2px solid var(--teal); outline-offset:3px; }
        .code { position:absolute; top:34px; right:40px; color:rgba(195,161,90,.18); font:700 76px/1 var(--z-ui-gothic); letter-spacing:-.04em; }
        @keyframes archiveReveal { from { opacity:0; transform:translateY(14px) scale(.99); } to { opacity:1; transform:translateY(0) scale(1); } }
        @media (max-width:560px) {
            body { align-items:end; padding:12px 12px max(12px,env(safe-area-inset-bottom)); background-position:center,center,center,center,42% 58%,center; }
            .panel { width:100%; min-height:min(540px,calc(100dvh - 24px)); padding:30px 22px calc(28px + env(safe-area-inset-bottom)); border-radius:14px; display:flex; flex-direction:column; justify-content:center; }
            .panel-edge { inset:8px; }
            .panel-edge::before { right:10px; bottom:9px; max-width:58%; text-align:right; line-height:1.45; }
            .panel::before { width:230px; height:345px; right:-82px; bottom:-86px; opacity:.08; }
            .code { top:27px; right:24px; font-size:58px; }
            .sigil { width:52px; height:52px; border-radius:10px; }
            .eyebrow { margin-top:24px; font-size:11px; letter-spacing:.13em; }
            h1 { font-size:clamp(34px,12vw,48px); line-height:1.12; }
            p { font-size:14px; line-height:1.85; }
            .actions { margin-top:26px; }
            .actions a { width:100%; }
        }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} }
    </style>
</head>
<body>
    <main class="panel">
        <div class="panel-edge" aria-hidden="true"></div>
        <div class="code" aria-hidden="true">404</div>
        <div class="sigil" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 12c1.7-2.7 6.3-2.7 8 0-1.7 2.7-6.3 2.7-8 0Z"/><circle cx="12" cy="12" r="1.5"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2"/></svg>
        </div>
        <div class="eyebrow">Archive signal lost</div>
        <h1>这份档案<br>不曾存在</h1>
        <p class="desc">你抵达了一段被抹去的记录。也许它被封存在禁书区，也许只是旧日诸神不愿它被看见。</p>
        <div class="actions">
            <a href="index.html">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                返回大厅
            </a>
        </div>
    </main>
</body>
</html>
